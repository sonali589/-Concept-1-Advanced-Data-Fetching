name: CI - Environment-aware Build

on:
  push:
    branches:
      - main
      - staging
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      # Branch-specific secrets: main -> production, staging -> staging, develop -> development
      - name: Set env for production (main)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "NEXT_PUBLIC_API_URL=${{ secrets.PROD_NEXT_PUBLIC_API_URL }}" >> $GITHUB_ENV
          echo "DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_OTHER=${{ secrets.PROD_NEXT_PUBLIC_OTHER }}" >> $GITHUB_ENV

      - name: Set env for staging
        if: github.ref == 'refs/heads/staging'
        run: |
          echo "NEXT_PUBLIC_API_URL=${{ secrets.STAGING_NEXT_PUBLIC_API_URL }}" >> $GITHUB_ENV
          echo "DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_OTHER=${{ secrets.STAGING_NEXT_PUBLIC_OTHER }}" >> $GITHUB_ENV

      - name: Set env for development (develop)
        if: github.ref == 'refs/heads/develop'
        run: |
          echo "NEXT_PUBLIC_API_URL=${{ secrets.DEV_NEXT_PUBLIC_API_URL }}" >> $GITHUB_ENV
          echo "DATABASE_URL=${{ secrets.DEV_DATABASE_URL }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_OTHER=${{ secrets.DEV_NEXT_PUBLIC_OTHER }}" >> $GITHUB_ENV

      # Optional: example of fetching secrets from AWS SSM (uncomment to use)
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v2
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: us-east-1
      #
      # - name: Fetch DB from AWS SSM (example)
      #   run: |
      #     DB=$(aws ssm get-parameter --name "/myapp/${{ github.ref_name }}/DATABASE_URL" --with-decryption --query "Parameter.Value" --output text)
      #     echo "DATABASE_URL=$DB" >> $GITHUB_ENV

      - name: Build
        run: |
          echo "NODE_ENV=$NODE_ENV"
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
